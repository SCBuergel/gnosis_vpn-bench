[project]
name = "gnosis-vpn-bench"
version = "0.2.0"
description = "Benchmark Gnosis VPN exits locally or on disposable remote VMs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Funding and recovery talk to Gnosis Chain; local benchmarking never needs it.
remote = ["web3>=7,<8", "eth-account>=0.13"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
gnosis_vpn-bench = "gvpn_bench.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Install editable (pip install -e '.[remote]'): profiles/, targets/,
# networks.toml and client-configs/ are read from the checkout.
[tool.setuptools.packages.find]
include = ["gvpn_bench*"]

[tool.setuptools.package-data]
gvpn_bench = ["assets/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# Plotting code ported verbatim from gnosis_vpn-monitor; behaviour-preserving.
"gvpn_bench/monitor.py" = ["E501", "B905", "RUF046", "SIM115", "B007"]
